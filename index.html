<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>משחק קריאה וכתיבה - נועם</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        /* --- 1. עיצוב ויזואלי ומעטפת (Safe Area) --- */
        :root {
            --bg-color: #f4f7f6;
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --text-color: #333;
            --notebook-top: #ccc;
            --notebook-bottom: #444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px; /* Safe Area מכל הכיוונים */
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 800px; /* הגבלת רוחב לאייפד */
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* --- ניווט ראשי --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        
        .btn-nav { background-color: #ffb300; color: #000; }
        .btn-action { background-color: var(--secondary-color); color: #fff; }
        .btn-success { background-color: var(--primary-color); color: #fff; }
        .btn-large { width: 100%; padding: 15px; font-size: 22px; margin-top: 15px; }

        /* --- אזורי וידאו --- */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        #youtubePlayer, #localPlayer { width: 100%; height: 100%; display: none; }
        
        /* כיסוי ל"השמעת קול בלבד" */
        #audioOnlyOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            display: none;
        }

        /* --- פאנלים --- */
        .panel { display: none; }
        .active-panel { display: block; }
        
        .control-group {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        input[type="text"], textarea {
            width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc;
            border-radius: 6px; margin-top: 5px; font-family: inherit;
        }

        /* --- אזור כתיבה (מחברת) במצב משחק --- */
        .notebook-area {
            position: relative;
            margin-top: 20px;
            height: 90px;
            border-top: 2px solid var(--notebook-top);
            border-bottom: 4px solid var(--notebook-bottom);
            background: #fafafa;
        }

        /* סגנון טקסט לאזור המחברת */
        .notebook-text {
            font-family: 'Guttman Yad', 'Ktav Yad', 'Amatic SC', cursive;
            font-size: 65px;
            line-height: 90px;
            text-align: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* קנבס לציור (טרייסינג) */
        #drawingCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            cursor: crosshair;
        }

        /* טקסט דהוי לטרייסינג */
        #fadedText {
            color: rgba(0, 0, 0, 0.15);
            pointer-events: none; /* כדי שהעט יצייר דרכו */
        }

        /* שדה טקסט לכתיבה חופשית (Scribble) */
        #scribbleInput {
            background: transparent;
            border: none;
            outline: none;
            z-index: 6;
            color: #000;
        }

        /* --- סרגל התקדמות --- */
        .progress-bar {
            text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px;
            color: var(--secondary-color);
        }

        .hidden { display: none !important; }
    </style>
    <!-- טעינת YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div id="app-container">
    
    <!-- סרגל ניווט עליון -->
    <div class="top-nav">
        <h2 style="margin:0;" id="mainTitle">מצב עריכה</h2>
        <button class="btn-nav" onclick="toggleMode()" id="modeToggleBtn">מעבר למשחק 🎮</button>
    </div>

    <!-- ==============================================
                     מצב עריכה
    =============================================== -->
    <div id="editPanel" class="panel active-panel">
        
        <div class="control-group">
            <h3>1. בחירת וידאו</h3>
            <label>הדבק קישור יוטיוב:</label>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="ytInput" placeholder="https://www.youtube.com/watch?v=...">
                <button class="btn-action" onclick="loadVideo('youtube')">טען</button>
            </div>
            
            <label>או העלה סרטון מהמחשב:</label>
            <input type="file" id="localInput" accept="video/*" onchange="loadVideo('local')" style="margin-top:5px; width:100%;">
        </div>

        <!-- אזור הנגן (משותף לעריכה ולמשחק) -->
        <div class="video-wrapper">
            <div id="youtubePlayer"></div>
            <video id="localPlayer" controls></video>
            <div id="audioOnlyOverlay">🔊 משמיע סאונד בלבד...</div>
        </div>

        <div class="control-group">
            <h3>2. תמליל הסרטון (לעזר)</h3>
            <textarea id="transcriptArea" rows="3" placeholder="הדבק כאן את התמליל מיוטיוב, ותוכל להעתיק ממנו לסצנות..."></textarea>
        </div>

        <div class="control-group">
            <h3>3. הגדרות סצנה חדשה</h3>
            <div style="display:flex; gap:10px; margin-bottom: 10px;">
                <button class="btn-action" onclick="markTime('start')">סמן In</button>
                <button class="btn-action" onclick="markTime('end')">סמן Out</button>
            </div>
            <p>זמנים: התחלה <span id="lblStart">0.0</span> | סיום <span id="lblEnd">0.0</span></p>
            
            <label>משפט לסצנה (כולל ניקוד):</label>
            <input type="text" id="sceneText" placeholder="למשל: שָׁלוֹם נוֹעַם!">
            
            <div style="margin-top: 15px;">
                <label>
                    <input type="checkbox" id="chkTracing" checked style="transform: scale(1.5); margin-left: 10px;">
                    הפעל מצב טרייסינג (אותיות דהויות לציור)
                </label>
            </div>
            <div style="margin-top: 10px;">
                <label>
                    <input type="checkbox" id="chkShowInGame" checked style="transform: scale(1.5); margin-left: 10px;">
                    הצג סצנה זו במשחק
                </label>
            </div>
            
            <button class="btn-success btn-large" onclick="saveScene()">שמור סצנה</button>
        </div>

        <div class="control-group">
            <h3>סצנות שמורות:</h3>
            <ul id="scenesList" style="line-height: 1.8;"></ul>
        </div>
    </div>

    <!-- ==============================================
                     מצב משחק
    =============================================== -->
    <div id="gamePanel" class="panel">
        
        <div class="progress-bar" id="gameProgress">סצנה 1 מתוך 5</div>
        
        <!-- הנגן יעבור לכאן אוטומטית בעזרת JS כדי למנוע כפילויות -->
        <div id="gameVideoPlaceholder"></div>
        
        <!-- כפתורי שליטה במשחק -->
        <div id="gameControls" style="text-align:center; margin-top:15px;">
            <button class="btn-action" id="btnPlayAudio" onclick="playAudioOnly()">השמע משפט 🔊</button>
        </div>

        <!-- אזור כתיבה / מחברת -->
        <div class="notebook-area" id="notebookArea">
            <!-- מיועד לטרייסינג -->
            <div id="fadedText" class="notebook-text"></div>
            <canvas id="drawingCanvas"></canvas>
            
            <!-- מיועד לכתיבה חופשית בעזרת Scribble (מוסתר כשטרייסינג פועל) -->
            <input type="text" id="scribbleInput" class="notebook-text hidden" placeholder="כתוב כאן..." autocomplete="off">
        </div>

        <button class="btn-success btn-large" id="btnDoneWriting" onclick="checkWriting()">סיימתי!</button>
        <button class="btn-action btn-large hidden" id="btnNextScene" onclick="nextScene()">המשך לסצנה הבאה ➡️</button>

    </div>
</div>

<script>
    /* =========================================================================
       ניהול משתנים גלובליים
    ========================================================================= */
    let currentMode = 'edit'; // 'edit' or 'game'
    let currentVideoId = null;
    let videoType = null; // 'youtube' or 'local'
    let scenes = [];
    
    // משתני עריכה
    let tempStart = 0;
    let tempEnd = 0;

    // משתני משחק
    let currentGameIndex = 0;
    let playingAudioOnly = false;
    let checkInterval = null;

    // יוטיוב API
    let ytPlayer = null;
    let ytReady = false;

    // אלמנטים
    const ytElement = document.getElementById('youtubePlayer');
    const localElement = document.getElementById('localPlayer');
    const overlay = document.getElementById('audioOnlyOverlay');
    const gamePlaceholder = document.getElementById('gameVideoPlaceholder');
    const editVideoWrapper = document.querySelector('.video-wrapper');

    // קנבס
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    /* =========================================================================
       פונקציות תשתית וטעינת וידאו
    ========================================================================= */
    function onYouTubeIframeAPIReady() {
        ytReady = true;
    }

    function toggleMode() {
        if (currentMode === 'edit') {
            if (scenes.filter(s => s.show).length === 0) {
                alert("אין סצנות פעילות למשחק עבור סרטון זה. אנא הוסף סצנות.");
                return;
            }
            currentMode = 'game';
            document.getElementById('editPanel').classList.remove('active-panel');
            document.getElementById('gamePanel').classList.add('active-panel');
            document.getElementById('mainTitle').innerText = "משחק קריאה";
            document.getElementById('modeToggleBtn').innerText = "חזור לעריכה ⚙️";
            
            // העברת הנגן לחלון המשחק
            gamePlaceholder.appendChild(editVideoWrapper);
            
            startGame();
        } else {
            currentMode = 'edit';
            document.getElementById('gamePanel').classList.remove('active-panel');
            document.getElementById('editPanel').classList.add('active-panel');
            document.getElementById('mainTitle').innerText = "מצב עריכה";
            document.getElementById('modeToggleBtn').innerText = "מעבר למשחק 🎮";
            
            // החזרת הנגן לחלון העריכה
            document.getElementById('editPanel').insertBefore(editVideoWrapper, document.getElementById('editPanel').children[2]);
            
            pauseVideo();
        }
    }

    function extractYTId(url) {
        const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function loadVideo(type) {
        pauseVideo();
        videoType = type;
        
        if (type === 'youtube') {
            const url = document.getElementById('ytInput').value;
            const vid = extractYTId(url);
            if (!vid) { alert("קישור יוטיוב לא תקין."); return; }
            currentVideoId = "YT_" + vid;
            
            localElement.style.display = 'none';
            ytElement.style.display = 'block';

            if (ytPlayer) {
                ytPlayer.loadVideoById(vid);
            } else if (ytReady) {
                ytPlayer = new YT.Player('youtubePlayer', {
                    videoId: vid,
                    playerVars: { 'playsinline': 1, 'controls': 1 },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
        } else if (type === 'local') {
            const file = document.getElementById('localInput').files[0];
            if (!file) return;
            currentVideoId = "LOC_" + file.name;
            
            ytElement.style.display = 'none';
            localElement.style.display = 'block';
            localElement.src = URL.createObjectURL(file);
            localElement.load();
        }
        
        loadScenesFromStorage();
    }

    function getCurrentTime() {
        if (videoType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) {
            return ytPlayer.getCurrentTime();
        } else if (videoType === 'local') {
            return localElement.currentTime;
        }
        return 0;
    }

    function seekTo(time) {
        if (videoType === 'youtube' && ytPlayer && ytPlayer.seekTo) {
            ytPlayer.seekTo(time, true);
        } else if (videoType === 'local') {
            localElement.currentTime = time;
        }
    }

    function playVideo() {
        if (videoType === 'youtube' && ytPlayer) {
            ytPlayer.playVideo();
        } else if (videoType === 'local') {
            localElement.play();
        }
    }

    function pauseVideo() {
        if (videoType === 'youtube' && ytPlayer) {
            ytPlayer.pauseVideo();
        } else if (videoType === 'local') {
            localElement.pause();
        }
    }

    /* =========================================================================
       מצב עריכה - ניהול סצנות
    ========================================================================= */
    function markTime(point) {
        const t = getCurrentTime();
        if (point === 'start') {
            tempStart = t;
            document.getElementById('lblStart').innerText = t.toFixed(2);
        } else {
            tempEnd = t;
            document.getElementById('lblEnd').innerText = t.toFixed(2);
        }
    }

    function saveScene() {
        const text = document.getElementById('sceneText').value.trim();
        const tracing = document.getElementById('chkTracing').checked;
        const show = document.getElementById('chkShowInGame').checked;

        if (!currentVideoId) { alert("יש לטעון וידאו קודם."); return; }
        if (tempEnd <= tempStart) { alert("זמן סיום חייב להיות גדול מהתחלה."); return; }
        if (text === "") { alert("חובה להזין טקסט לסצנה."); return; }

        const scene = {
            id: Date.now(),
            start: tempStart,
            end: tempEnd,
            text: text,
            tracing: tracing,
            show: show
        };

        scenes.push(scene);
        
        let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        allData[currentVideoId] = scenes;
        localStorage.setItem('ninjagoData', JSON.stringify(allData));
        
        renderScenes();
        
        // ניקוי טופס
        document.getElementById('sceneText').value = "";
    }

    function loadScenesFromStorage() {
        let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        scenes = allData[currentVideoId] || [];
        renderScenes();
    }

    function renderScenes() {
        const ul = document.getElementById('scenesList');
        ul.innerHTML = '';
        scenes.forEach((s, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>סצנה ${i+1}:</strong> ${s.start.toFixed(1)}s - ${s.end.toFixed(1)}s | 
                            "${s.text}" | 
                            ${s.tracing ? '✏️ טרייסינג' : '⌨️ כתיבה'} | 
                            ${s.show ? '👁️ פעיל' : '🚫 מוסתר'}`;
            ul.appendChild(li);
        });
    }

    /* =========================================================================
       מצב משחק - לוגיקה וקנבס
    ========================================================================= */
    function getActiveScenes() {
        return scenes.filter(s => s.show).sort((a,b) => a.start - b.start);
    }

    function startGame() {
        currentGameIndex = 0;
        loadGameScene();
    }

    function loadGameScene() {
        const activeScenes = getActiveScenes();
        if (currentGameIndex >= activeScenes.length) {
            alert("כל הכבוד נועם! סיימת את כל הסצנות!");
            toggleMode();
            return;
        }

        const scene = activeScenes[currentGameIndex];
        
        // עדכון סרגל התקדמות
        document.getElementById('gameProgress').innerText = `סצנה ${currentGameIndex + 1} מתוך ${activeScenes.length}`;
        
        // הכנת ממשק המשתמש לסצנה
        document.getElementById('btnNextScene').classList.add('hidden');
        document.getElementById('btnDoneWriting').classList.remove('hidden');
        document.getElementById('btnPlayAudio').classList.remove('hidden');
        
        // קפיצת הוידאו להתחלה ועצירה (פריים קפוא)
        seekTo(scene.start);
        setTimeout(pauseVideo, 300); // מוודא שהפריים נטען לפני שעוצר
        
        // הגדרת אזור הכתיבה לפי בחירת טרייסינג
        const faded = document.getElementById('fadedText');
        const input = document.getElementById('scribbleInput');
        
        if (scene.tracing) {
            faded.innerText = scene.text;
            faded.classList.remove('hidden');
            canvas.classList.remove('hidden');
            input.classList.add('hidden');
            resizeCanvas(); // איפוס קנבס
        } else {
            faded.innerText = "";
            faded.classList.add('hidden');
            canvas.classList.add('hidden');
            input.classList.remove('hidden');
            input.value = "";
            input.focus(); // מקפיץ מקלדת/Scribble
        }
    }

    function playAudioOnly() {
        const scene = getActiveScenes()[currentGameIndex];
        playingAudioOnly = true;
        
        seekTo(scene.start);
        playVideo();
        overlay.style.display = 'flex'; // מסתיר את הוידאו ויזואלית כדי לדמות סאונד בלבד
        
        if(checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(() => {
            if (getCurrentTime() >= scene.end) {
                pauseVideo();
                overlay.style.display = 'none';
                playingAudioOnly = false;
                seekTo(scene.start); // חוזר לתמונה הקפואה
                clearInterval(checkInterval);
            }
        }, 100);
    }

    // כדי לתמוך גם ביוטיוב שמדווח על שינוי סטטוס
    function onPlayerStateChange(event) {
        if (currentMode === 'game' && event.data === YT.PlayerState.PLAYING) {
            // הלוגיקה מנוהלת ב-setInterval
        }
    }

    // אירוע זמן לקובץ מקומי במצב משחק
    localElement.addEventListener('timeupdate', () => {
        if (currentMode === 'game') {
            const scene = getActiveScenes()[currentGameIndex];
            if (localElement.currentTime >= scene.end) {
                localElement.pause();
                if (playingAudioOnly) {
                    overlay.style.display = 'none';
                    playingAudioOnly = false;
                    localElement.currentTime = scene.start;
                } else {
                    // סיים לנגן וידאו מלא (הפרס)
                    document.getElementById('btnNextScene').classList.remove('hidden');
                }
            }
        }
    });

    /* --- מנגנון בדיקת הטקסט --- */
    function checkWriting() {
        const scene = getActiveScenes()[currentGameIndex];
        
        if (scene.tracing) {
            // בטרייסינג הבדיקה היא ידנית (הילד צייר ולחץ סיימתי)
            rewardAndPlayFullVideo();
        } else {
            // בדיקה סלחנית של טקסט מ-Scribble
            const userInput = document.getElementById('scribbleInput').value;
            const originalText = scene.text;
            
            if (normalizeHebrew(userInput) === normalizeHebrew(originalText)) {
                rewardAndPlayFullVideo();
            } else {
                alert("כמעט! נסה לתקן קצת ותבדוק שוב.");
            }
        }
    }

    function normalizeHebrew(text) {
        // מתעלם מרווחים, סימני פיסוק, ניקוד וממיר אותיות סופיות לרגילות לצורך השוואה
        let clean = text.replace(/[\u0591-\u05C7\s\p{P}]/gu, ''); 
        clean = clean.replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ץ/g, 'צ').replace(/ף/g, 'פ').replace(/ך/g, 'כ');
        return clean;
    }

    function rewardAndPlayFullVideo() {
        const scene = getActiveScenes()[currentGameIndex];
        document.getElementById('btnDoneWriting').classList.add('hidden');
        document.getElementById('btnPlayAudio').classList.add('hidden');
        
        seekTo(scene.start);
        playVideo();
        
        // יצירת טיימר ליוטיוב (לוקאלי מנוהל ב-timeupdate)
        if (videoType === 'youtube') {
            if(checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(() => {
                if (getCurrentTime() >= scene.end) {
                    pauseVideo();
                    clearInterval(checkInterval);
                    document.getElementById('btnNextScene').classList.remove('hidden');
                }
            }, 100);
        }
    }

    function nextScene() {
        currentGameIndex++;
        loadGameScene();
    }

    /* =========================================================================
       ניהול קנבס (ציור באצבע / עט)
    ========================================================================= */
    function resizeCanvas() {
        const area = document.getElementById('notebookArea');
        canvas.width = area.offsetWidth;
        canvas.height = area.offsetHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';
    }

    // מאזינים לשינוי גודל חלון כדי לשמור על קנבס תקין
    window.addEventListener('resize', () => {
        if (currentMode === 'game' && getActiveScenes()[currentGameIndex]?.tracing) {
            resizeCanvas();
        }
    });

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function endDraw(e) {
        e.preventDefault();
        isDrawing = false;
        ctx.closePath();
    }

    // הוספת אירועי עכבר ומגע לקנבס
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseout', endDraw);

    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', endDraw, {passive: false});

</script>
</body>
</html>
