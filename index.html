<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>משחק קריאה וכתיבה - נועם</title>
    
    <style>
        /* טעינת פונט 'גברת לוין' ישירות מהשרת שלך */
        @font-face {
            font-family: 'GveretLevin';
            src: url('./GveretLevinAlefAlefAlef-Regular.woff2') format('woff2'),
                 url('./GveretLevinAlefAlefAlef-Regular.woff') format('woff'),
                 url('./GveretLevinAlefAlefAlef-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        
        :root {
            --bg-color: #f4f7f6;
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --text-color: #333;
            --notebook-top: #ccc;
            --notebook-bottom: #444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: max-width 0.3s ease;
        }
        
        #app-container.game-mode {
            max-width: 95%; /* הרחבת המסך במצב משחק */
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        
        .btn-nav { background-color: #ffb300; color: #000; }
        .btn-action { background-color: var(--secondary-color); color: #fff; }
        .btn-success { background-color: var(--primary-color); color: #fff; }
        .btn-danger { background-color: #f44336; color: #fff; }
        .btn-small { padding: 6px 10px; font-size: 14px; margin-left: 3px; }
        .btn-large { width: 100%; padding: 15px; font-size: 24px; margin-top: 15px; }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .game-mode .video-wrapper {
            width: 60%;
            margin: 0 auto 15px auto;
        }
        
        #youtubePlayer, #localPlayer { width: 100%; height: 100%; display: none; }
        
        /* פס הסתרת הכתוביות */
        #subtitleBlocker {
            position: absolute;
            bottom: 45px; 
            left: 0;
            width: 100%;
            height: 18%; 
            background-color: #000;
            z-index: 5;
            display: none;
            pointer-events: none; 
        }
        
        .game-mode #subtitleBlocker { display: block; }

        #audioOnlyOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            display: none;
        }

        .panel { display: none; }
        .active-panel { display: block; }
        
        .control-group {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        input[type="text"]:not(.notebook-text), textarea, select {
            width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc;
            border-radius: 6px; margin-top: 5px; font-family: inherit;
        }

        /* --- אזור המחברת והכתיבה --- */
        .notebook-area {
            position: relative;
            margin-top: 25px;
            height: 140px; 
            border-top: 2px solid var(--notebook-top);
            border-bottom: 4px solid var(--notebook-bottom);
            background: #fafafa;
            overflow: visible; /* מאפשר לאותיות סופיות לרדת מתחת לקו בלי להיחתך */
        }

        .notebook-text {
            font-family: 'GveretLevin', Arial, sans-serif !important;
            font-size: clamp(40px, 8vw, 95px); 
            line-height: 1;
            text-align: center;
            width: 100%;
            position: absolute;
            bottom: -20px; /* תיקון השורה המרחפת: מוריד את הטקסט לשבת על הקו */
            margin: 0;
            white-space: nowrap; 
            border: none;
            background: transparent;
            outline: none;
        }

        #fadedText { 
            color: rgba(0, 0, 0, 0.15); 
            pointer-events: none;
        }
        
        #keyboardInput {
            color: #000;
            z-index: 6;
        }

        #drawingCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            cursor: crosshair;
        }

        .progress-bar {
            text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px;
            color: var(--secondary-color);
        }

        .hidden { display: none !important; }
        .time-display { font-family: monospace; font-size: 18px; font-weight: bold; }
        .time-controls-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .game-controls-container { display: flex; justify-content: center; margin: 20px 0; }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div id="app-container">
    <div class="top-nav">
        <h2 style="margin:0;" id="mainTitle">מצב עריכה</h2>
        <button class="btn-nav" onclick="toggleMode()" id="modeToggleBtn">מעבר למשחק 🎮</button>
    </div>

    <!-- ================= מצב עריכה ================= -->
    <div id="editPanel" class="panel active-panel">
        
        <div class="control-group" style="background-color: #e3f2fd;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">הפרויקטים שלי</h3>
                <button class="btn-nav" onclick="startNewProject()" style="background-color: #fff; border: 2px solid #ffb300;">➕ פרויקט חדש ונקי</button>
            </div>
            <select id="projectSelect" onchange="loadSelectedProject()" style="margin-top: 15px;">
                <option value="">-- בחר פרויקט קיים --</option>
            </select>
        </div>

        <div class="control-group">
            <h3>1. פרטי הפרויקט והסרטון</h3>
            <label>שם הפרויקט:</label>
            <input type="text" id="projectNameInput" placeholder="למשל: נינג'גו עונה 3 פרק 1" style="margin-bottom: 15px;">
            
            <label>הדבק קישור יוטיוב:</label>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="ytInput" placeholder="https://www.youtube.com/watch?v=...">
                <button class="btn-action" onclick="loadVideo('youtube')">טען סרטון</button>
            </div>
        </div>

        <div class="video-wrapper">
            <div id="youtubePlayer"></div>
            <video id="localPlayer" controls></video>
            <div id="audioOnlyOverlay">🔊 משמיע סאונד בלבד...</div>
            <div id="subtitleBlocker"></div> 
        </div>

        <!-- מנגנון ייבוא כתוביות חכם -->
        <div class="control-group" style="border: 2px solid #673ab7;">
            <h3 style="color: #673ab7; margin-top:0;">🚀 ייצור סצנות אוטומטי (מתוך SRT)</h3>
            <p style="font-size: 14px; margin-top:0;">הדבק כאן את הטקסט מקובץ הכתוביות (SRT) שהורדת:</p>
            <textarea id="srtInput" rows="4" dir="ltr" style="text-align:left;" placeholder="1&#10;00:00:04,000 --> 00:00:06,500&#10;שלום נועם..."></textarea>
            <button class="btn-action btn-large" style="background-color: #673ab7;" onclick="parseSRT()">חתוך וייצר סצנות אוטומטית ⚡</button>
        </div>

        <div class="control-group">
            <h3>או: יצירת סצנה ידנית</h3>
            <div class="time-controls-row">
                <button class="btn-action" onclick="markTime('start')">סמן In</button>
                <button class="btn-small" onclick="adjustInTime(-1)">-1ש'</button>
                <button class="btn-small" onclick="adjustInTime(1)">+1ש'</button>
                <span class="time-display" id="lblStart">0:00</span>
                <span style="margin: 0 10px;">|</span>
                <button class="btn-action" onclick="markTime('end')">סמן Out</button>
                <button class="btn-small" onclick="adjustOutTime(-1)">-1ש'</button>
                <button class="btn-small" onclick="adjustOutTime(1)">+1ש'</button>
                <span class="time-display" id="lblEnd">0:00</span>
            </div>
            
            <button class="btn-nav" onclick="previewSelectedClip()" style="margin-bottom: 15px; width: 100%;">▶️ נגן קטע נבחר לבדיקה</button>
            
            <input type="hidden" id="editSceneId" value="">
            <label>משפט לסצנה:</label>
            <input type="text" id="sceneText" placeholder="למשל: שָׁלוֹם נוֹעַם!">
            
            <div style="margin-top: 15px; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
                <label style="font-weight: bold;">סוג המשימה לנועם:</label>
                <div style="margin-top: 8px;">
                    <input type="radio" name="taskType" id="typeTyping" value="typing" checked> 
                    <label for="typeTyping">⌨️ הקלדה (עם בדיקה אוטומטית)</label>
                </div>
                <div style="margin-top: 8px;">
                    <input type="radio" name="taskType" id="typeTracing" value="tracing"> 
                    <label for="typeTracing">✏️ טרייסינג על קנבס (עם סריקת כיסוי פיקסלים)</label>
                </div>
            </div>
            
            <div style="margin-top: 10px;">
                <label><input type="checkbox" id="chkShowInGame" checked style="transform: scale(1.5); margin-left: 10px;"> פעיל במשחק</label>
            </div>
            
            <button class="btn-success btn-large" onclick="saveScene()">שמור סצנה</button>
        </div>

        <div class="control-group">
            <h3>סצנות בפרויקט:</h3>
            <ul id="scenesList" style="line-height: 2;"></ul>
        </div>
    </div>

    <!-- ================= מצב משחק ================= -->
    <div id="gamePanel" class="panel">
        <div class="progress-bar" id="gameProgress">סצנה 1 מתוך 5</div>
        
        <div id="gameVideoPlaceholder"></div>
        
        <div class="game-controls-container">
            <button class="btn-action" style="font-size: 20px; padding: 12px 30px;" id="btnPlayAudio" onclick="playAudioOnly()">השמע משפט 🔊</button>
        </div>

        <div class="notebook-area" id="notebookArea">
            <div id="fadedText" class="notebook-text hidden"></div>
            <canvas id="drawingCanvas" class="hidden"></canvas>
            <input type="text" id="keyboardInput" class="notebook-text hidden" placeholder="" autocomplete="off" autocorrect="off" spellcheck="false" dir="rtl">
        </div>

        <div style="display:flex; gap: 10px; margin-top: 25px;">
            <button class="btn-success btn-large" style="margin-top:0;" id="btnDoneWriting" onclick="checkTask()">סיימתי! 🎬</button>
            <button class="btn-danger btn-large hidden" style="margin-top:0; flex-basis: 30%;" id="btnClearCanvas" onclick="resizeCanvas()">נקה לוח 🗑️</button>
        </div>
        
        <button class="btn-action btn-large hidden" id="btnNextScene" onclick="nextScene()">המשך לסצנה הבאה ➡️</button>
    </div>
</div>

<script>
    let currentMode = 'edit';
    let currentVideoId = null;
    let currentProjectName = ""; // משתנה חדש לשם הפרויקט
    let videoType = null;
    let scenes = [];
    let tempStart = 0;
    let tempEnd = 0;
    let currentGameIndex = 0;
    let playingAudioOnly = false;
    let checkInterval = null;
    let ytPlayer = null;
    let ytReady = false;

    const ytElement = document.getElementById('youtubePlayer');
    const localElement = document.getElementById('localPlayer');
    const overlay = document.getElementById('audioOnlyOverlay');
    const gamePlaceholder = document.getElementById('gameVideoPlaceholder');
    const editVideoWrapper = document.querySelector('.video-wrapper');
    const appContainer = document.getElementById('app-container');
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return m + ":" + s;
    }

    function updateTimeDisplay() {
        document.getElementById('lblStart').innerText = formatTime(tempStart);
        document.getElementById('lblEnd').innerText = formatTime(tempEnd);
    }

    function onYouTubeIframeAPIReady() { ytReady = true; populateProjectsList(); }

    function startNewProject() {
        currentVideoId = null;
        currentProjectName = "";
        videoType = null;
        scenes = [];
        tempStart = 0;
        tempEnd = 0;
        
        document.getElementById('projectSelect').value = '';
        document.getElementById('projectNameInput').value = '';
        document.getElementById('ytInput').value = '';
        document.getElementById('sceneText').value = '';
        document.getElementById('srtInput').value = '';
        document.getElementById('editSceneId').value = '';
        document.getElementById('typeTyping').checked = true;
        
        updateTimeDisplay();
        renderScenes();
        
        ytElement.style.display = 'none';
        localElement.style.display = 'none';
        
        if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
        localElement.pause();
        localElement.src = '';
    }

    function populateProjectsList() {
        const allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        const select = document.getElementById('projectSelect');
        const currentVal = currentProjectName || select.value;
        
        select.innerHTML = '<option value="">-- בחר פרויקט קיים --</option>';
        Object.keys(allData).forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.innerText = key; // עכשיו מוצג שם הפרויקט במקום קוד היוטיוב
            select.appendChild(option);
        });
        if (currentVal && allData[currentVal]) select.value = currentVal;
    }

    function loadSelectedProject() {
        const selected = document.getElementById('projectSelect').value;
        if (!selected) { startNewProject(); return; }

        let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        let projData = allData[selected];

        // תאימות לאחור: אם הפרויקט הישן נשמר כמערך סצנות פשוט
        if (Array.isArray(projData)) {
            scenes = projData;
            currentVideoId = selected;
            currentProjectName = selected;
        } else {
            // מבנה חדש: מכיל את מזהה הווידאו ומערך הסצנות
            scenes = projData.scenes || [];
            currentVideoId = projData.videoId;
            currentProjectName = selected;
        }

        document.getElementById('projectNameInput').value = currentProjectName;
        videoType = currentVideoId.startsWith("YT_") ? 'youtube' : 'local';
        
        if (videoType === 'youtube') {
            const vid = currentVideoId.replace("YT_", "");
            localElement.style.display = 'none';
            ytElement.style.display = 'block';
            if (ytPlayer) ytPlayer.loadVideoById(vid);
            else if (ytReady) {
                ytPlayer = new YT.Player('youtubePlayer', {
                    videoId: vid,
                    playerVars: { 'playsinline': 1, 'controls': 1, 'modestbranding': 1, 'rel': 0 },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
        }
        renderScenes();
    }

    function loadVideo(type) {
        const projName = document.getElementById('projectNameInput').value.trim();
        if(!projName) { alert("אנא הזן שם לפרויקט (למשל: נינג'גו פרק 1) לפני טעינת הסרטון."); return; }

        pauseVideo();
        videoType = type;
        
        if (type === 'youtube') {
            const url = document.getElementById('ytInput').value;
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            const vid = (match && match[2].length === 11) ? match[2] : null;
            if (!vid) { alert("קישור יוטיוב לא תקין."); return; }
            currentVideoId = "YT_" + vid;
            currentProjectName = projName;
            
            localElement.style.display = 'none';
            ytElement.style.display = 'block';

            if (ytPlayer) ytPlayer.loadVideoById(vid);
            else if (ytReady) {
                ytPlayer = new YT.Player('youtubePlayer', {
                    videoId: vid,
                    playerVars: { 'playsinline': 1, 'controls': 1, 'modestbranding': 1, 'rel': 0 },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
        }
        
        // טעינת סצנות אם הפרויקט כבר קיים
        let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        if (allData[currentProjectName]) {
             if(Array.isArray(allData[currentProjectName])) {
                 scenes = allData[currentProjectName];
             } else {
                 scenes = allData[currentProjectName].scenes || [];
             }
        } else {
             scenes = []; 
        }
        
        renderScenes();
        populateProjectsList();
        document.getElementById('projectSelect').value = currentProjectName;
    }

    function getCurrentTime() {
        if (videoType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime();
        if (videoType === 'local') return localElement.currentTime;
        return 0;
    }

    function seekTo(time) {
        if (videoType === 'youtube' && ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(time, true);
        if (videoType === 'local') localElement.currentTime = time;
    }

    function seekRelative(seconds) {
        const newTime = Math.max(0, getCurrentTime() + seconds);
        seekTo(newTime);
    }

    function playVideo() {
        if (videoType === 'youtube' && ytPlayer) ytPlayer.playVideo();
        if (videoType === 'local') localElement.play();
    }

    function pauseVideo() {
        if (videoType === 'youtube' && ytPlayer) ytPlayer.pauseVideo();
        if (videoType === 'local') localElement.pause();
    }

    function markTime(point) {
        const t = getCurrentTime();
        if (point === 'start') {
            tempStart = t;
            tempEnd = t + 6; 
        } else { tempEnd = t; }
        updateTimeDisplay();
    }

    function adjustInTime(seconds) {
        tempStart += seconds;
        if (tempStart < 0) tempStart = 0;
        if (tempStart >= tempEnd) tempEnd = tempStart + 1;
        updateTimeDisplay();
    }

    function adjustOutTime(seconds) {
        tempEnd += seconds;
        if (tempEnd <= tempStart) tempEnd = tempStart + 1;
        updateTimeDisplay();
    }

    function previewSelectedClip() {
        if (tempEnd <= tempStart) return;
        seekTo(tempStart);
        playVideo();
        if(checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(() => {
            if (getCurrentTime() >= tempEnd) {
                pauseVideo();
                clearInterval(checkInterval);
            }
        }, 100);
    }

    function parseSRT() {
        if (!currentVideoId) { alert("חובה לטעון סרטון יוטיוב ולתת שם לפרויקט קודם."); return; }
        
        const srtText = document.getElementById('srtInput').value.trim();
        if (!srtText) { alert("הדבק טקסט מקובץ ה-SRT."); return; }

        const blocks = srtText.split(/\n\s*\n/);
        let newScenesCount = 0;
        const taskType = document.querySelector('input[name="taskType"]:checked').value;
        const tracing = (taskType === 'tracing');

        blocks.forEach(block => {
            const lines = block.split('\n');
            if (lines.length >= 3) {
                const timeLine = lines[1];
                const textLines = lines.slice(2).join(' '); 

                const timeMatch = timeLine.match(/(\d{2}):(\d{2}):(\d{2}),(\d{3}) --> (\d{2}):(\d{2}):(\d{2}),(\d{3})/);
                if (timeMatch) {
                    const start = parseInt(timeMatch[1])*3600 + parseInt(timeMatch[2])*60 + parseInt(timeMatch[3]) + parseInt(timeMatch[4])/1000;
                    const end = parseInt(timeMatch[5])*3600 + parseInt(timeMatch[6])*60 + parseInt(timeMatch[7]) + parseInt(timeMatch[8])/1000;
                    
                    const cleanText = textLines.replace(/<[^>]+>/g, '').trim(); 

                    if (cleanText.length > 1) { 
                        scenes.push({
                            id: Date.now() + Math.random(),
                            start: start,
                            end: end,
                            text: cleanText,
                            tracing: tracing,
                            show: true
                        });
                        newScenesCount++;
                    }
                }
            }
        });

        if (newScenesCount > 0) {
            saveData();
            document.getElementById('srtInput').value = '';
            alert("הצלחה! נוצרו " + newScenesCount + " סצנות חדשות אוטומטית.");
        } else {
            alert("שגיאה: לא הצלחתי לזהות פורמט SRT תקין בטקסט שהודבק.");
        }
    }

    function saveScene() {
        const text = document.getElementById('sceneText').value.trim();
        const taskType = document.querySelector('input[name="taskType"]:checked').value;
        const tracing = (taskType === 'tracing');
        const show = document.getElementById('chkShowInGame').checked;
        const editId = document.getElementById('editSceneId').value;

        if (!currentVideoId) { alert("יש לטעון סרטון יוטיוב ולתת שם לפרויקט."); return; }
        if (tempEnd <= tempStart) { alert("זמן סיום חייב להיות גדול מהתחלה."); return; }
        if (text === "") { alert("חובה להזין טקסט לסצנה."); return; }

        const sceneObj = {
            id: editId ? parseInt(editId) : Date.now(),
            start: tempStart, end: tempEnd, text: text, tracing: tracing, show: show
        };

        if (editId) {
            const idx = scenes.findIndex(s => s.id === sceneObj.id);
            if (idx > -1) scenes[idx] = sceneObj;
        } else { scenes.push(sceneObj); }
        
        saveData();
        document.getElementById('sceneText').value = "";
        document.getElementById('editSceneId').value = "";
    }

    function saveData() {
        const projName = document.getElementById('projectNameInput').value.trim();
        if (!projName) { alert("חובה להזין שם פרויקט לפני שמירה."); return; }
        if (!currentVideoId) { return; }

        let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        scenes.sort((a, b) => a.start - b.start);
        
        allData[projName] = {
            videoId: currentVideoId,
            scenes: scenes
        };

        // מחיקת השם הישן מהזיכרון במקרה של שינוי שם פרויקט
        if (currentProjectName && currentProjectName !== projName) {
            delete allData[currentProjectName];
        }
        currentProjectName = projName;

        localStorage.setItem('ninjagoData', JSON.stringify(allData));
        renderScenes();
        populateProjectsList();
    }

    function editScene(id) {
        const s = scenes.find(x => x.id === id);
        if (!s) return;
        tempStart = s.start;
        tempEnd = s.end;
        updateTimeDisplay();
        document.getElementById('sceneText').value = s.text;
        document.getElementById(s.tracing ? 'typeTracing' : 'typeTyping').checked = true;
        document.getElementById('chkShowInGame').checked = s.show;
        document.getElementById('editSceneId').value = s.id;
    }

    function deleteScene(id) {
        if(confirm("למחוק סצנה זו?")) {
            scenes = scenes.filter(x => x.id !== id);
            saveData();
            if (scenes.length === 0) {
                let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
                delete allData[currentProjectName];
                localStorage.setItem('ninjagoData', JSON.stringify(allData));
                startNewProject();
            }
        }
    }

    function renderScenes() {
        const ul = document.getElementById('scenesList');
        ul.innerHTML = '';
        scenes.forEach((s, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>סצנה ${i+1}:</strong> ${formatTime(s.start)} - ${formatTime(s.end)} | 
                            "${s.text}" | ${s.tracing ? '✏️ טרייסינג' : '⌨️ הקלדה'} 
                            <button class="btn-action btn-small" onclick="editScene(${s.id})">ערוך</button>
                            <button class="btn-danger btn-small" onclick="deleteScene(${s.id})">מחק</button>`;
            ul.appendChild(li);
        });
    }

    function toggleMode() {
        if (currentMode === 'edit') {
            if (scenes.filter(s => s.show).length === 0) { alert("אין סצנות פעילות למשחק פרויקט זה."); return; }
            currentMode = 'game';
            document.getElementById('editPanel').classList.remove('active-panel');
            document.getElementById('gamePanel').classList.add('active-panel');
            appContainer.classList.add('game-mode');
            document.getElementById('mainTitle').innerText = "משחק קריאה";
            document.getElementById('modeToggleBtn').innerText = "חזור לעריכה ⚙️";
            gamePlaceholder.appendChild(editVideoWrapper);
            startGame();
        } else {
            currentMode = 'edit';
            document.getElementById('gamePanel').classList.remove('active-panel');
            document.getElementById('editPanel').classList.add('active-panel');
            appContainer.classList.remove('game-mode');
            document.getElementById('mainTitle').innerText = "מצב עריכה";
            document.getElementById('modeToggleBtn').innerText = "מעבר למשחק 🎮";
            document.getElementById('editPanel').insertBefore(editVideoWrapper, document.getElementById('editPanel').children[2]);
            pauseVideo();
        }
    }

    function getActiveScenes() { return scenes.filter(s => s.show).sort((a,b) => a.start - b.start); }

    function startGame() {
        currentGameIndex = 0;
        loadGameScene();
    }

    function loadGameScene() {
        const activeScenes = getActiveScenes();
        if (currentGameIndex >= activeScenes.length) {
            alert("כל הכבוד נועם! סיימת את כל הסצנות!");
            toggleMode();
            return;
        }

        const scene = activeScenes[currentGameIndex];
        document.getElementById('gameProgress').innerText = `סצנה ${currentGameIndex + 1} מתוך ${activeScenes.length}`;
        
        document.getElementById('btnNextScene').classList.add('hidden');
        document.getElementById('btnPlayAudio').classList.remove('hidden');
        document.getElementById('btnDoneWriting').classList.remove('hidden');
        
        seekTo(scene.start);
        setTimeout(pauseVideo, 300); 
        
        const faded = document.getElementById('fadedText');
        const canvasEl = document.getElementById('drawingCanvas');
        const inputEl = document.getElementById('keyboardInput');
        const clearBtn = document.getElementById('btnClearCanvas');
        
        if (scene.tracing) {
            faded.innerText = scene.text;
            faded.classList.remove('hidden');
            canvasEl.classList.remove('hidden');
            inputEl.classList.add('hidden');
            clearBtn.classList.remove('hidden');
            resizeCanvas();
        } else {
            faded.classList.add('hidden');
            canvasEl.classList.add('hidden');
            inputEl.classList.remove('hidden');
            clearBtn.classList.add('hidden');
            inputEl.value = "";
        }
    }

    function playAudioOnly() {
        const scene = getActiveScenes()[currentGameIndex];
        playingAudioOnly = true;
        seekTo(scene.start);
        playVideo();
        overlay.style.display = 'flex';
        
        if(checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(() => {
            if (getCurrentTime() >= scene.end) {
                pauseVideo();
                overlay.style.display = 'none';
                playingAudioOnly = false;
                seekTo(scene.start);
                clearInterval(checkInterval);
            }
        }, 100);
    }

    function onPlayerStateChange(event) {}

    function normalizeHebrew(text) {
        let clean = text.replace(/[\u0591-\u05C7\s\p{P}]/gu, ''); 
        return clean.replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ץ/g, 'צ').replace(/ף/g, 'פ').replace(/ך/g, 'כ');
    }

    function validateTracing() {
        const scene = getActiveScenes()[currentGameIndex];
        const fadedElement = document.getElementById('fadedText');
        
        const hiddenCanvas = document.createElement('canvas');
        hiddenCanvas.width = canvas.width;
        hiddenCanvas.height = canvas.height;
        const hCtx = hiddenCanvas.getContext('2d');
        
        const style = window.getComputedStyle(fadedElement);
        hCtx.font = style.fontSize + " 'GveretLevin', Arial";
        hCtx.textAlign = "center";
        hCtx.textBaseline = "alphabetic";
        
        const textY = canvas.height - 20; 
        hCtx.fillText(scene.text, canvas.width / 2, textY);
        
        const refData = hCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height).data;
        const userData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        
        let targetPixels = 0;
        let hitPixels = 0;
        
        for (let i = 3; i < refData.length; i += 4) {
            if (refData[i] > 50) { 
                targetPixels++;
                if (userData[i] > 50) { 
                    hitPixels++;
                }
            }
        }
        
        if (targetPixels === 0) return true; 
        
        const overlapRatio = hitPixels / targetPixels;
        return overlapRatio > 0.25; 
    }

    function checkTask() {
        const scene = getActiveScenes()[currentGameIndex];

        if (scene.tracing) {
            if (validateTracing()) {
                rewardAndPlayFullVideo();
            } else {
                alert("נראה שפספסת קצת... נסה לעבור שוב על האותיות בתוך הקווים! ✏️");
            }
        } else {
            const userInput = document.getElementById('keyboardInput').value;
            if (normalizeHebrew(userInput) === normalizeHebrew(scene.text)) {
                rewardAndPlayFullVideo();
            } else {
                alert("כמעט נכון! נסה לבדוק שוב את האותיות.");
            }
        }
    }

    function rewardAndPlayFullVideo() {
        const scene = getActiveScenes()[currentGameIndex];
        document.getElementById('btnDoneWriting').classList.add('hidden');
        document.getElementById('btnClearCanvas').classList.add('hidden');
        document.getElementById('btnPlayAudio').classList.add('hidden');
        document.getElementById('keyboardInput').blur();
        
        seekTo(scene.start);
        playVideo();
        
        if(checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(() => {
            if (getCurrentTime() >= scene.end) {
                pauseVideo();
                clearInterval(checkInterval);
                document.getElementById('btnNextScene').classList.remove('hidden');
            }
        }, 100);
    }

    function nextScene() { currentGameIndex++; loadGameScene(); }

    function resizeCanvas() {
        if (!document.getElementById('drawingCanvas').classList.contains('hidden')) {
            const area = document.getElementById('notebookArea');
            canvas.width = area.offsetWidth;
            canvas.height = area.offsetHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 6; 
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';
        }
    }

    window.addEventListener('resize', () => { if (currentMode === 'game') resizeCanvas(); });

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y); ctx.stroke();
    }

    function endDraw(e) { e.preventDefault(); isDrawing = false; ctx.closePath(); }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseout', endDraw);
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', endDraw, {passive: false});

    window.onload = populateProjectsList;
</script>
