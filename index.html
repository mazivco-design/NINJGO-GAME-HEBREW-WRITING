<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>עריכת משחק קריאה - נינג'גו (בסיס יציב)</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .panel { margin-top: 15px; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #video-container { margin-top: 15px; display: none; }
        
        button { padding: 8px 16px; margin-left: 10px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
        .btn-load { background-color: #2196F3; color: white; border: none; font-weight: bold; }
        .btn-save { background-color: #4CAF50; color: white; border: none; font-weight: bold; }
        
        input[type="text"] { width: 60%; padding: 8px; font-size: 16px; }
        
        /* עיצוב הטקסט - יישור ופונט כתב יד */
        .game-text-area {
            position: relative;
            margin-top: 30px;
            height: 60px;
            text-align: center;
            background: #eee;
            border-radius: 8px;
        }
        
        .text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            font-family: 'Guttman Yad', 'Ktav Yad', 'Amatic SC', cursive;
            font-size: 45px;
            line-height: 60px;
        }
        
        .text-faded { color: rgba(0, 0, 0, 0.15); }
        .text-active { color: #000; }
    </style>
    <!-- טעינת ה-API של יוטיוב שמאפשר שליטה בסרטון -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <h1>ניהול ועריכת סצנות</h1>
    
    <div class="panel">
        <label>הדבק קישור ליוטיוב:</label><br><br>
        <input type="text" id="youtubeUrl" placeholder="לדוגמה: https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        <button class="btn-load" onclick="loadYouTubeVideo()">טען סרטון</button>
    </div>

    <div id="video-container">
        <div id="ytplayer"></div>
    </div>

    <div class="panel" id="editorPanel" style="display: none;">
        <button onclick="markStartTime()">סמן התחלת סצנה (In)</button>
        <button onclick="markEndTime()">סמן סיום סצנה (Out)</button>
        <p>זמן התחלה: <span id="displayStart">0</span> | זמן סיום: <span id="displayEnd">0</span></p>
        
        <label>טקסט לניקוד וקריאה (יוצג בכתב יד):</label><br>
        <textarea id="sceneText" rows="2" style="width: 100%; margin-top: 5px; font-size: 20px; font-family: 'Guttman Yad', cursive;"></textarea><br><br>
        
        <button class="btn-save" onclick="saveScene()">שמור סצנה</button>
    </div>

    <div class="panel">
        <h3>סצנות שנשמרו עבור סרטון זה:</h3>
        <ul id="scenesList"></ul>
    </div>

    <div class="panel">
        <h3>תצוגה מקדימה לטקסט המשחק (איך שנועם יראה את זה):</h3>
        <div class="game-text-area">
            <div class="text-layer text-faded">שלום נועם, ברוך הבא לנינג'גו</div>
            <div class="text-layer text-active" style="width: 40%; overflow: hidden; text-align: right; white-space: nowrap; margin-right: 30%;">שלום נועם,</div> 
        </div>
    </div>

    <script>
        let player;
        let currentVideoId = "";
        let startTime = 0;
        let endTime = 0;
        let scenes = [];

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadYouTubeVideo() {
            const url = document.getElementById('youtubeUrl').value;
            const videoId = extractVideoID(url);
            
            if (!videoId) {
                alert("לא הצלחתי לזהות קישור יוטיוב תקין. נסה שוב.");
                return;
            }

            currentVideoId = videoId;
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('editorPanel').style.display = 'block';

            if (player) {
                player.loadVideoById(currentVideoId);
            } else {
                player = new YT.Player('ytplayer', {
                    height: '360',
                    width: '640',
                    videoId: currentVideoId,
                    playerVars: {
                        'playsinline': 1,
                        'controls': 1 // מאפשר את פסי השליטה של יוטיוב
                    }
                });
            }
            
            loadSavedScenes();
        }

        function markStartTime() {
            if (player && player.getCurrentTime) {
                startTime = player.getCurrentTime();
                document.getElementById('displayStart').innerText = startTime.toFixed(2) + "s";
            }
        }

        function markEndTime() {
            if (player && player.getCurrentTime) {
                endTime = player.getCurrentTime();
                document.getElementById('displayEnd').innerText = endTime.toFixed(2) + "s";
            }
        }

        function saveScene() {
            const text = document.getElementById('sceneText').value;
            
            if (endTime <= startTime) {
                alert("זמן הסיום חייב להיות אחרי זמן ההתחלה.");
                return;
            }
            if (text.trim() === "") {
                alert("אנא הזן טקסט לקריאה.");
                return;
            }
            
            const newScene = { 
                id: Date.now(), 
                start: startTime, 
                end: endTime, 
                text: text 
            };
            
            scenes.push(newScene);
            saveToLocalStorage();
            renderScenesList();
            
            document.getElementById('sceneText').value = '';
            document.getElementById('displayStart').innerText = '0';
            document.getElementById('displayEnd').innerText = '0';
        }

        function saveToLocalStorage() {
            let allData = JSON.parse(localStorage.getItem('ninjago_yt_data')) || {};
            allData[currentVideoId] = scenes;
            localStorage.setItem('ninjago_yt_data', JSON.stringify(allData));
        }

        function loadSavedScenes() {
            let allData = JSON.parse(localStorage.getItem('ninjago_yt_data')) || {};
            scenes = allData[currentVideoId] || [];
            renderScenesList();
        }

        function renderScenesList() {
            const list = document.getElementById('scenesList');
            list.innerHTML = '';
            scenes.forEach((scene, index) => {
                const li = document.createElement('li');
                li.style.marginBottom = "10px";
                li.innerHTML = `<strong>סצנה ${index + 1}:</strong> ${scene.start.toFixed(1)}s - ${scene.end.toFixed(1)}s <br> <span style="font-family: 'Guttman Yad', cursive; font-size: 22px;">${scene.text}</span>`;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
