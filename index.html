<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>עריכת משחק קריאה - נינג'גו</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #video-container { max-width: 600px; margin-bottom: 20px; }
        /* עיצוב בסיסי לנגן */
        video { width: 100%; border: 2px solid #ccc; border-radius: 8px; }
        .editor-panel { margin-top: 15px; padding: 15px; background: #f5f5f5; border-radius: 8px; }
        button { padding: 8px 16px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>מצב עריכה - יצירת סצנות לנועם</h1>
    
    <div id="video-container">
        <!-- המאפיין controls נוסף כאן כדי לאפשר הרצה, עצירה וסקרבינג (Scrubbing) -->
        <video id="gameVideo" controls>
            <!-- החלף את ה-src לנתיב הסרטון שלך -->
            <source src="ninjago_episode.mp4" type="video/mp4">
            הדפדפן שלך אינו תומך בתגית וידאו.
        </video>
    </div>

    <div class="editor-panel">
        <button onclick="markStartTime()">סמן התחלת סצנה (In)</button>
        <button onclick="markEndTime()">סמן סיום סצנה (Out)</button>
        <p>זמן התחלה: <span id="displayStart">0</span> | זמן סיום: <span id="displayEnd">0</span></p>
        
        <label>טקסט מנוקד לקריאה:</label><br>
        <textarea id="sceneText" rows="4" style="width: 100%; margin-top: 5px;"></textarea><br><br>
        
        <button onclick="saveScene()" style="background-color: #4CAF50; color: white; border: none;">שמור סצנה</button>
    </div>

    <h3>סצנות שנשמרו:</h3>
    <ul id="scenesList"></ul>

    <script>
        let startTime = 0;
        let endTime = 0;
        const video = document.getElementById('gameVideo');
        const scenes = []; // המערך שישמור את כל הסצנות שחתכת

        function markStartTime() {
            startTime = video.currentTime;
            document.getElementById('displayStart').innerText = startTime.toFixed(2) + "s";
        }

        function markEndTime() {
            endTime = video.currentTime;
            document.getElementById('displayEnd').innerText = endTime.toFixed(2) + "s";
        }

        function saveScene() {
            const text = document.getElementById('sceneText').value;
            
            if (endTime <= startTime) {
                alert("זמן הסיום חייב להיות אחרי זמן ההתחלה.");
                return;
            }
            if (text.trim() === "") {
                alert("אנא הזן טקסט לקריאה עבור סצנה זו.");
                return;
            }
            
            // יצירת אובייקט הסצנה
            const newScene = { 
                id: scenes.length + 1,
                start: startTime, 
                end: endTime, 
                text: text 
            };
            
            scenes.push(newScene);
            
            // עדכון התצוגה של הרשימה
            const listItem = document.createElement('li');
            listItem.innerHTML = `<strong>סצנה ${newScene.id}:</strong> ${newScene.start.toFixed(2)}s - ${newScene.end.toFixed(2)}s <br> טקסט: ${newScene.text}`;
            document.getElementById('scenesList').appendChild(listItem);
            
            // איפוס שדות לקראת הסצנה הבאה
            document.getElementById('sceneText').value = '';
            document.getElementById('displayStart').innerText = '0';
            document.getElementById('displayEnd').innerText = '0';
            
            console.log("סצנות עדכניות:", scenes);
        }
    </script>
</body>
</html>
