<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>משחק קריאה וכתיבה - נועם</title>
    <link href="https://fonts.cdnfonts.com/css/guttman-yad" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --text-color: #333;
            --notebook-top: #ccc;
            --notebook-bottom: #444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        
        .btn-nav { background-color: #ffb300; color: #000; }
        .btn-action { background-color: var(--secondary-color); color: #fff; }
        .btn-success { background-color: var(--primary-color); color: #fff; }
        .btn-danger { background-color: #f44336; color: #fff; }
        .btn-small { padding: 6px 10px; font-size: 14px; margin-left: 3px; }
        .btn-large { width: 100%; padding: 15px; font-size: 22px; margin-top: 15px; }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .game-mode .video-wrapper {
            width: 65%;
            margin: 0 auto 15px auto;
        }
        
        #youtubePlayer, #localPlayer { width: 100%; height: 100%; display: none; }
        
        /* פס שחור להסתרת כתוביות צרובות וסרגל יוטיוב */
        #subtitleBlocker {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 18%; /* מכסה את ה-18% התחתונים של הסרטון */
            background-color: #000; /* צבע שחור שמתמזג עם הנגן */
            z-index: 5;
            display: none; /* מוסתר כברירת מחדל במצב עריכה */
        }
        
        /* מציג את הפס השחור רק במצב משחק */
        .game-mode #subtitleBlocker {
            display: block;
        }

        #audioOnlyOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            display: none;
        }

        .panel { display: none; }
        .active-panel { display: block; }
        
        .control-group {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        input[type="text"], textarea, select {
            width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc;
            border-radius: 6px; margin-top: 5px; font-family: inherit;
        }

        #referenceBox {
            background: #e3f2fd;
            border: 2px dashed var(--secondary-color);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        
        #referenceTextDisplay {
            font-family: 'Guttman Yad', cursive;
            font-size: 45px;
            color: #000;
        }

        .notebook-area {
            position: relative;
            margin-top: 15px;
            height: 140px; 
            border-top: 2px solid var(--notebook-top);
            border-bottom: 4px solid var(--notebook-bottom);
            background: #fafafa;
        }

        .notebook-text {
            font-family: 'Guttman Yad', cursive;
            font-size: 95px;
            line-height: 1;
            text-align: center;
            width: 100%;
            position: absolute;
            bottom: -5px; 
            margin: 0;
            pointer-events: none;
        }

        #drawingCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            cursor: crosshair;
        }

        #fadedText { color: rgba(0, 0, 0, 0.15); }

        .progress-bar {
            text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px;
            color: var(--secondary-color);
        }

        .hidden { display: none !important; }
        .time-display { font-family: monospace; font-size: 18px; font-weight: bold; }
        
        .time-controls-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div id="app-container">
    <div class="top-nav">
        <h2 style="margin:0;" id="mainTitle">מצב עריכה</h2>
        <button class="btn-nav" onclick="toggleMode()" id="modeToggleBtn">מעבר למשחק 🎮</button>
    </div>

    <!-- מצב עריכה -->
    <div id="editPanel" class="panel active-panel">
        
        <div class="control-group" style="background-color: #e3f2fd;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">הפרויקטים שלי</h3>
                <button class="btn-nav" onclick="startNewProject()" style="background-color: #fff; border: 2px solid #ffb300;">➕ פרויקט חדש ונקי</button>
            </div>
            <select id="projectSelect" onchange="loadSelectedProject()" style="margin-top: 15px;">
                <option value="">-- בחר פרויקט קיים --</option>
            </select>
        </div>

        <div class="control-group">
            <h3>1. טעינת סרטון לעריכה</h3>
            <label>הדבק קישור יוטיוב:</label>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="ytInput" placeholder="https://www.youtube.com/watch?v=...">
                <button class="btn-action" onclick="loadVideo('youtube')">טען סרטון</button>
            </div>
        </div>

        <div class="video-wrapper">
            <div id="youtubePlayer"></div>
            <video id="localPlayer" controls></video>
            <div id="audioOnlyOverlay">🔊 משמיע סאונד בלבד...</div>
            <div id="subtitleBlocker"></div> <!-- פס הסתרת הכתוביות -->
        </div>
        
        <div style="text-align: center; margin-bottom: 15px;">
            <button class="btn-nav" onclick="seekRelative(-5)">⏪ אחורה 5 שניות</button>
            <button class="btn-nav" onclick="seekRelative(5)">קדימה 5 שניות ⏩</button>
        </div>

        <div class="control-group">
            <h3>2. תמליל הסרטון</h3>
            <textarea id="transcriptArea" rows="2" placeholder="הדבק תמליל לעזר..."></textarea>
        </div>

        <div class="control-group">
            <h3>3. הגדרות סצנה</h3>
            
            <div class="time-controls-row">
                <button class="btn-action" onclick="markTime('start')">סמן In</button>
                <button class="btn-small" onclick="adjustInTime(-1)">-1ש'</button>
                <button class="btn-small" onclick="adjustInTime(1)">+1ש'</button>
                <span class="time-display" id="lblStart">0:00</span>
                
                <span style="margin: 0 10px;">|</span>
                
                <button class="btn-action" onclick="markTime('end')">סמן Out</button>
                <button class="btn-small" onclick="adjustOutTime(-1)">-1ש'</button>
                <button class="btn-small" onclick="adjustOutTime(1)">+1ש'</button>
                <span class="time-display" id="lblEnd">0:00</span>
            </div>
            
            <button class="btn-nav" onclick="previewSelectedClip()" style="margin-bottom: 15px; width: 100%;">▶️ נגן קטע נבחר לבדיקה</button>
            
            <input type="hidden" id="editSceneId" value="">
            <label>משפט לסצנה:</label>
            <input type="text" id="sceneText" placeholder="למשל: שָׁלוֹם נוֹעַם!">
            
            <div style="margin-top: 15px;">
                <label><input type="checkbox" id="chkTracing" checked style="transform: scale(1.5); margin-left: 10px;"> טרייסינג מופעל (אותיות דהויות מההתחלה)</label>
            </div>
            <div style="margin-top: 10px;">
                <label><input type="checkbox" id="chkShowInGame" checked style="transform: scale(1.5); margin-left: 10px;"> פעיל במשחק</label>
            </div>
            
            <button class="btn-success btn-large" onclick="saveScene()">שמור סצנה</button>
        </div>

        <div class="control-group">
            <h3>סצנות בפרויקט הנוכחי:</h3>
            <ul id="scenesList" style="line-height: 2;"></ul>
        </div>
    </div>

    <!-- מצב משחק -->
    <div id="gamePanel" class="panel">
        <div class="progress-bar" id="gameProgress">סצנה 1 מתוך 5</div>
        
        <div id="gameVideoPlaceholder"></div>
        
        <div id="gameControls" style="text-align:center; margin-top:10px;">
            <button class="btn-action" id="btnPlayAudio" onclick="playAudioOnly()">השמע משפט 🔊</button>
        </div>

        <div id="referenceBox">
            <div>המשפט הנכון:</div>
            <div id="referenceTextDisplay"></div>
        </div>

        <div class="notebook-area" id="notebookArea">
            <div id="fadedText" class="notebook-text hidden"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div style="display:flex; gap: 10px; margin-top: 15px;">
            <button class="btn-success btn-large" style="margin-top:0;" id="btnDoneWriting" onclick="checkWriting()">סיימתי לכתוב ✍️</button>
            <button class="btn-danger btn-large" style="margin-top:0; flex-basis: 30%;" id="btnClearCanvas" onclick="resizeCanvas()">נקה לוח 🗑️</button>
        </div>
        
        <button class="btn-action btn-large hidden" id="btnNextScene" onclick="nextScene()">המשך לסצנה הבאה ➡️</button>
    </div>
</div>

<script>
    let currentMode = 'edit';
    let currentVideoId = null;
    let videoType = null;
    let scenes = [];
    let tempStart = 0;
    let tempEnd = 0;
    let currentGameIndex = 0;
    let playingAudioOnly = false;
    let checkInterval = null;
    let ytPlayer = null;
    let ytReady = false;
    let isCheckingPhase = false; 

    const ytElement = document.getElementById('youtubePlayer');
    const localElement = document.getElementById('localPlayer');
    const overlay = document.getElementById('audioOnlyOverlay');
    const gamePlaceholder = document.getElementById('gameVideoPlaceholder');
    const editVideoWrapper = document.querySelector('.video-wrapper');
    const appContainer = document.getElementById('app-container');
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return m + ":" + s;
    }

    function updateTimeDisplay() {
        document.getElementById('lblStart').innerText = formatTime(tempStart);
        document.getElementById('lblEnd').innerText = formatTime(tempEnd);
    }

    function onYouTubeIframeAPIReady() { ytReady = true; populateProjectsList(); }

    function startNewProject() {
        currentVideoId = null;
        videoType = null;
        scenes = [];
        tempStart = 0;
        tempEnd = 0;
        
        document.getElementById('projectSelect').value = '';
        document.getElementById('ytInput').value = '';
        document.getElementById('sceneText').value = '';
        document.getElementById('transcriptArea').value = '';
        document.getElementById('editSceneId').value = '';
        
        updateTimeDisplay();
        renderScenes();
        
        ytElement.style.display = 'none';
        localElement.style.display = 'none';
        
        if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
            ytPlayer.stopVideo();
        }
        
        localElement.pause();
        localElement.src = '';
    }

    function populateProjectsList() {
        const allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        const select = document.getElementById('projectSelect');
        const currentVal = select.value;
        
        select.innerHTML = '<option value="">-- בחר פרויקט קיים --</option>';
        Object.keys(allData).forEach(key => {
            if (allData[key] && allData[key].length > 0) {
                const option = document.createElement('option');
                option.value = key;
                option.innerText = "פרויקט: " + key;
                select.appendChild(option);
            }
        });
        
        if (currentVal && allData[currentVal] && allData[currentVal].length > 0) {
            select.value = currentVal;
        }
    }

    function loadSelectedProject() {
        const selected = document.getElementById('projectSelect').value;
        if (!selected) {
            startNewProject();
            return;
        }
        currentVideoId = selected;
        videoType = selected.startsWith("YT_") ? 'youtube' : 'local';
        
        if (videoType === 'youtube') {
            const vid = selected.replace("YT_", "");
            localElement.style.display = 'none';
            ytElement.style.display = 'block';
            if (ytPlayer) ytPlayer.loadVideoById(vid);
            else if (ytReady) {
                ytPlayer = new YT.Player('youtubePlayer', {
                    videoId: vid,
                    playerVars: { 
                        'playsinline': 1, 
                        'controls': 1, 
                        'modestbranding': 1, 
                        'rel': 0,
                        'hl': 'he' // שפה
                    },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
        }
        loadScenesFromStorage();
    }

    function loadVideo(type) {
        pauseVideo();
        videoType = type;
        
        if (type === 'youtube') {
            const url = document.getElementById('ytInput').value;
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            const vid = (match && match[2].length === 11) ? match[2] : null;
            if (!vid) { alert("קישור יוטיוב לא תקין."); return; }
            currentVideoId = "YT_" + vid;
            
            localElement.style.display = 'none';
            ytElement.style.display = 'block';

            if (ytPlayer) ytPlayer.loadVideoById(vid);
            else if (ytReady) {
                ytPlayer = new YT.Player('youtubePlayer', {
                    videoId: vid,
                    playerVars: { 
                        'playsinline': 1, 
                        'controls': 1, 
                        'modestbranding': 1, 
                        'rel': 0,
                        'hl': 'he'
                    },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
        }
        loadScenesFromStorage();
        populateProjectsList();
        document.getElementById('projectSelect').value = currentVideoId;
    }

    function getCurrentTime() {
        if (videoType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime();
        if (videoType === 'local') return localElement.currentTime;
        return 0;
    }

    function seekTo(time) {
        if (videoType === 'youtube' && ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(time, true);
        if (videoType === 'local') localElement.currentTime = time;
    }

    function seekRelative(seconds) {
        const newTime = Math.max(0, getCurrentTime() + seconds);
        seekTo(newTime);
    }

    function playVideo() {
        if (videoType === 'youtube' && ytPlayer) ytPlayer.playVideo();
        if (videoType === 'local') localElement.play();
    }

    function pauseVideo() {
        if (videoType === 'youtube' && ytPlayer) ytPlayer.pauseVideo();
        if (videoType === 'local') localElement.pause();
    }

    function markTime(point) {
        const t = getCurrentTime();
        if (point === 'start') {
            tempStart = t;
            tempEnd = t + 6; 
        } else {
            tempEnd = t;
        }
        updateTimeDisplay();
    }

    function adjustInTime(seconds) {
        tempStart += seconds;
        if (tempStart < 0) tempStart = 0;
        if (tempStart >= tempEnd) tempEnd = tempStart + 1;
        updateTimeDisplay();
    }

    function adjustOutTime(seconds) {
        tempEnd += seconds;
        if (tempEnd <= tempStart) tempEnd = tempStart + 1;
        updateTimeDisplay();
    }

    function previewSelectedClip() {
        if (tempEnd <= tempStart) return;
        seekTo(tempStart);
        playVideo();
        if(checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(() => {
            if (getCurrentTime() >= tempEnd) {
                pauseVideo();
                clearInterval(checkInterval);
            }
        }, 100);
    }

    function saveScene() {
        const text = document.getElementById('sceneText').value.trim();
        const tracing = document.getElementById('chkTracing').checked;
        const show = document.getElementById('chkShowInGame').checked;
        const editId = document.getElementById('editSceneId').value;

        if (!currentVideoId) { alert("יש לטעון פרויקט קודם."); return; }
        if (tempEnd <= tempStart) { alert("זמן סיום חייב להיות גדול מהתחלה."); return; }
        if (text === "") { alert("חובה להזין טקסט לסצנה."); return; }

        const sceneObj = {
            id: editId ? parseInt(editId) : Date.now(),
            start: tempStart, end: tempEnd, text: text, tracing: tracing, show: show
        };

        if (editId) {
            const idx = scenes.findIndex(s => s.id === sceneObj.id);
            if (idx > -1) scenes[idx] = sceneObj;
        } else {
            scenes.push(sceneObj);
        }
        
        saveData();
        document.getElementById('sceneText').value = "";
        document.getElementById('editSceneId').value = "";
    }

    function saveData() {
        let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        allData[currentVideoId] = scenes;
        localStorage.setItem('ninjagoData', JSON.stringify(allData));
        renderScenes();
        populateProjectsList();
    }

    function loadScenesFromStorage() {
        let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
        scenes = allData[currentVideoId] || [];
        renderScenes();
    }

    function editScene(id) {
        const s = scenes.find(x => x.id === id);
        if (!s) return;
        tempStart = s.start;
        tempEnd = s.end;
        updateTimeDisplay();
        document.getElementById('sceneText').value = s.text;
        document.getElementById('chkTracing').checked = s.tracing;
        document.getElementById('chkShowInGame').checked = s.show;
        document.getElementById('editSceneId').value = s.id;
    }

    function deleteScene(id) {
        if(confirm("האם אתה בטוח שברצונך למחוק סצנה זו?")) {
            scenes = scenes.filter(x => x.id !== id);
            saveData();
            
            if (scenes.length === 0) {
                let allData = JSON.parse(localStorage.getItem('ninjagoData')) || {};
                delete allData[currentVideoId];
                localStorage.setItem('ninjagoData', JSON.stringify(allData));
                startNewProject();
            }
        }
    }

    function renderScenes() {
        const ul = document.getElementById('scenesList');
        ul.innerHTML = '';
        scenes.forEach((s, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>סצנה ${i+1}:</strong> ${formatTime(s.start)} - ${formatTime(s.end)} | 
                            "${s.text}" | ${s.tracing ? '✏️ טרייסינג' : '⌨️ כתיבה חופשית'} 
                            <button class="btn-action btn-small" onclick="editScene(${s.id})">ערוך</button>
                            <button class="btn-danger btn-small" onclick="deleteScene(${s.id})">מחק</button>`;
            ul.appendChild(li);
        });
    }

    function toggleMode() {
        if (currentMode === 'edit') {
            if (scenes.filter(s => s.show).length === 0) {
                alert("אין סצנות פעילות למשחק פרויקט זה.");
                return;
            }
            currentMode = 'game';
            document.getElementById('editPanel').classList.remove('active-panel');
            document.getElementById('gamePanel').classList.add('active-panel');
            
            appContainer.classList.add('game-mode');
            
            document.getElementById('mainTitle').innerText = "משחק קריאה";
            document.getElementById('modeToggleBtn').innerText = "חזור לעריכה ⚙️";
            gamePlaceholder.appendChild(editVideoWrapper);
            startGame();
        } else {
            currentMode = 'edit';
            document.getElementById('gamePanel').classList.remove('active-panel');
            document.getElementById('editPanel').classList.add('active-panel');
            
            appContainer.classList.remove('game-mode');
            
            document.getElementById('mainTitle').innerText = "מצב עריכה";
            document.getElementById('modeToggleBtn').innerText = "מעבר למשחק 🎮";
            document.getElementById('editPanel').insertBefore(editVideoWrapper, document.getElementById('editPanel').children[2]);
            pauseVideo();
        }
    }

    function getActiveScenes() { return scenes.filter(s => s.show).sort((a,b) => a.start - b.start); }

    function startGame() {
        currentGameIndex = 0;
        loadGameScene();
    }

    function loadGameScene() {
        const activeScenes = getActiveScenes();
        if (currentGameIndex >= activeScenes.length) {
            alert("כל הכבוד נועם! סיימת את כל הסצנות!");
            toggleMode();
            return;
        }

        const scene = activeScenes[currentGameIndex];
        document.getElementById('gameProgress').innerText = `סצנה ${currentGameIndex + 1} מתוך ${activeScenes.length}`;
        
        document.getElementById('btnNextScene').classList.add('hidden');
        document.getElementById('btnPlayAudio').classList.remove('hidden');
        document.getElementById('btnClearCanvas').classList.remove('hidden');
        document.getElementById('referenceBox').style.display = 'none';
        
        const btnDone = document.getElementById('btnDoneWriting');
        btnDone.classList.remove('hidden');
        btnDone.innerText = "סיימתי לכתוב ✍️";
        isCheckingPhase = false;
        
        seekTo(scene.start);
        setTimeout(pauseVideo, 300);
        
        const faded = document.getElementById('fadedText');
        faded.innerText = scene.text;
        
        resizeCanvas();
        
        if (scene.tracing) {
            faded.classList.remove('hidden'); 
        } else {
            faded.classList.add('hidden'); 
        }
    }

    function playAudioOnly() {
        const scene = getActiveScenes()[currentGameIndex];
        playingAudioOnly = true;
        seekTo(scene.start);
        playVideo();
        overlay.style.display = 'flex';
        
        if(checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(() => {
            if (getCurrentTime() >= scene.end) {
                pauseVideo();
                overlay.style.display = 'none';
                playingAudioOnly = false;
                seekTo(scene.start);
                clearInterval(checkInterval);
            }
        }, 100);
    }

    function onPlayerStateChange(event) {}

    function checkWriting() {
        const scene = getActiveScenes()[currentGameIndex];
        const btnDone = document.getElementById('btnDoneWriting');

        if (!scene.tracing && !isCheckingPhase) {
            isCheckingPhase = true;
            document.getElementById('referenceTextDisplay').innerText = scene.text;
            document.getElementById('referenceBox').style.display = 'block';
            btnDone.innerText = "בדקתי ותיקנתי! נגן סרטון 🎬";
        } else {
            rewardAndPlayFullVideo();
        }
    }

    function rewardAndPlayFullVideo() {
        const scene = getActiveScenes()[currentGameIndex];
        document.getElementById('btnDoneWriting').classList.add('hidden');
        document.getElementById('btnClearCanvas').classList.add('hidden');
        document.getElementById('btnPlayAudio').classList.add('hidden');
        document.getElementById('referenceBox').style.display = 'none';
        
        seekTo(scene.start);
        playVideo();
        
        if(checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(() => {
            if (getCurrentTime() >= scene.end) {
                pauseVideo();
                clearInterval(checkInterval);
                document.getElementById('btnNextScene').classList.remove('hidden');
            }
        }, 100);
    }

    function nextScene() {
        currentGameIndex++;
        loadGameScene();
    }

    function resizeCanvas() {
        const area = document.getElementById('notebookArea');
        canvas.width = area.offsetWidth;
        canvas.height = area.offsetHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';
    }

    window.addEventListener('resize', () => {
        if (currentMode === 'game') resizeCanvas();
    });

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function endDraw(e) { e.preventDefault(); isDrawing = false; ctx.closePath(); }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseout', endDraw);
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', endDraw, {passive: false});

    window.onload = populateProjectsList;
</script>
</body>
</html>
